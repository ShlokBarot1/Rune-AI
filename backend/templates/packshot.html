<!doctype html>
<html><head><meta charset="utf-8">${FONT_LINK}<style>
:root { --w: ${W}px; --h: ${H}px; --u: ${U}px; --pad: ${PAD}px; --top: ${TOP}px; --cap: ${CAP}px;
        --c1: ${C1}; --c2: ${C2}; --ink: ${INK}; --font: "${FONT}"; --font2: "${FONT2}"; }
${BASE_CSS}
/* The product is the hero: big and centred on the brand colour, the scene only a soft glow behind it. */
body { background: var(--c1); color: var(--ink); }
.bg { filter: blur(calc(var(--u) * 3)) saturate(1.1); opacity: .35; transform: scale(1.15); }
.shade { background: radial-gradient(ellipse at 50% 58%, rgba(255,255,255,.28) 0%, rgba(0,0,0,0) 45%, rgba(0,0,0,.25) 100%); }
.headline { position: absolute; left: var(--pad); right: var(--pad); top: calc(var(--top) + var(--u) * 13); text-align: center;
  font-size: calc(var(--u) * 7); line-height: 1.04; font-weight: 800; }
.sub { margin-top: calc(var(--u) * 1.6); font-size: calc(var(--u) * 3.4); font-weight: 500; opacity: .9; }
.offer { justify-content: center; }
.product { bottom: calc(var(--h) * .17); height: 50%; max-width: 74%; }
.product.right { left: 50%; right: auto; transform: translateX(-50%); }
.tags { position: absolute; left: var(--pad); right: var(--pad); bottom: calc(var(--h) * .1); display: flex;
  justify-content: center; flex-wrap: wrap; gap: calc(var(--u) * 1.2); }
.tags span { background: var(--c2); color: var(--c1); border-radius: 999px; font-weight: 800;
  font-size: calc(var(--u) * 2.9); padding: calc(var(--u) * .9) calc(var(--u) * 2.2); }
.ctawrap { position: absolute; left: 0; right: 0; bottom: calc(var(--h) * .035); text-align: center; }
.cta { background: var(--ink); color: var(--c1); }
body.tall .headline { top: calc(var(--top) + var(--u) * 6); }
body.tall .product { bottom: auto; top: 30%; height: 30%; }
body.tall .tags { bottom: auto; top: 58%; }
body.tall .ctawrap { bottom: auto; top: calc(65% - var(--u) * 9); }
body.wide .headline { right: 50%; text-align: left; } body.wide .tags { right: 50%; justify-content: flex-start; bottom: 26%; }
body.wide .product, body.wide .product.right { left: 75%; height: 80%; bottom: 10%; }
body.wide .ctawrap { right: 50%; text-align: left; padding-left: var(--pad); }
</style></head><body class="${BODY_CLASS}" dir="${DIR}">
<div class="bg" style="background-image:url('${BG}')"></div><div class="shade"></div>
${LOGO}
<div class="headline">${HEADLINE}<div class="sub">${SUB}</div><div class="offer">${OFFER}</div></div>
<img class="product ${PROD_CLASS}" src="${PRODUCT}">
<div class="tags">${TAGS}</div>
<div class="ctawrap ${CTA_CLASS}"><span class="cta">${CTA}</span></div>
<div class="caption">${CAPTION}</div>
</body></html>
