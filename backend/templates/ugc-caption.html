<!doctype html>
<html><head><meta charset="utf-8">${FONT_LINK}<style>
:root { --w: ${W}px; --h: ${H}px; --u: ${U}px; --pad: ${PAD}px; --top: ${TOP}px; --cap: ${CAP}px;
        --c1: ${C1}; --c2: ${C2}; --font: "${FONT}"; --font2: "${FONT2}"; }
${BASE_CSS}
.shade { background: linear-gradient(180deg, rgba(0,0,0,.25), rgba(0,0,0,0) 50%, rgba(0,0,0,.25)); }
.bubble { position: absolute; left: var(--pad); right: 18%; top: calc(var(--top) + var(--u) * 13); }
.bubble .line { display: inline; background: #fff; color: #111; font-weight: 700; line-height: 1.55;
  font-size: calc(var(--u) * 5.6); padding: calc(var(--u) * .5) calc(var(--u) * 1.6); border-radius: calc(var(--u) * 1.2);
  box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.stars { margin-top: calc(var(--u) * 3); font-size: calc(var(--u) * 4.4); color: #FFC531; text-shadow: 0 1px 6px rgba(0,0,0,.5); }
.stars em { font-style: normal; color: #fff; font-size: calc(var(--u) * 3.2); margin-left: calc(var(--u) * 1.5); }
.product { right: var(--pad); left: auto; transform: rotate(6deg); bottom: ${PROD_BOTTOM}px; height: ${PROD_H}px; max-width: 50%; }
.ctawrap { position: absolute; left: var(--pad); top: ${CTA_TOP}px; }
</style></head><body class="${BODY_CLASS}" dir="${DIR}">
<div class="bg" style="background-image:url('${BG}')"></div><div class="shade"></div>
${LOGO}
<div class="bubble"><span class="line">${HEADLINE}</span><div class="stars">${STARS}<em>${SUB}</em></div></div>
<img class="product ${PROD_CLASS}" src="${PRODUCT}">
<div class="ctawrap ${CTA_CLASS}"><span class="cta">${CTA}</span></div>
<div class="caption">${CAPTION}</div>
</body></html>
