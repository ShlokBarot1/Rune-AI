<!doctype html>
<html><head><meta charset="utf-8">${FONT_LINK}<style>
:root { --w: ${W}px; --h: ${H}px; --u: ${U}px; --pad: ${PAD}px; --top: ${TOP}px; --cap: ${CAP}px;
        --c1: ${C1}; --c2: ${C2}; --font: "${FONT}"; --font2: "${FONT2}"; }
${BASE_CSS}
.headline { position: absolute; left: var(--pad); right: 38%; top: calc(var(--top) + var(--u) * 10);
  font-size: calc(var(--u) * 7.2); line-height: 1.05; font-weight: 800; text-shadow: 0 2px 18px rgba(0,0,0,.45); }
.badge { position: absolute; right: var(--pad); top: calc(var(--top) + var(--u) * 8);
  width: calc(var(--u) * 26); height: calc(var(--u) * 26); border-radius: 50%; background: var(--c2); color: var(--c1);
  display: flex; align-items: center; justify-content: center; text-align: center; transform: rotate(-8deg);
  font-weight: 900; font-size: calc(var(--u) * 4.6); line-height: 1.05; padding: calc(var(--u) * 3);
  box-shadow: 0 calc(var(--u) * 1) calc(var(--u) * 4) rgba(0,0,0,.35); border: calc(var(--u) * .8) dashed var(--c1); }
.product { bottom: ${PROD_BOTTOM}px; height: ${PROD_H}px; max-width: 65%; }
.ctawrap { position: absolute; left: var(--pad); top: ${CTA_TOP}px; }
</style></head><body class="${BODY_CLASS}" dir="${DIR}">
<div class="bg" style="background-image:url('${BG}')"></div><div class="shade"></div>
${LOGO}
<div class="headline">${HEADLINE}<div class="offer">${OFFER}</div></div>
<div class="badge ${BADGE_CLASS}">${SUB}</div>
<img class="product ${PROD_CLASS}" src="${PRODUCT}">
<div class="ctawrap ${CTA_CLASS}"><span class="cta">${CTA}</span></div>
<div class="caption">${CAPTION}</div>
</body></html>
