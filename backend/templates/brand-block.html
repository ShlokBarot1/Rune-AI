<!doctype html>
<html><head><meta charset="utf-8">${FONT_LINK}<style>
:root { --w: ${W}px; --h: ${H}px; --u: ${U}px; --pad: ${PAD}px; --top: ${TOP}px; --cap: ${CAP}px;
        --c1: ${C1}; --c2: ${C2}; --ink: ${INK}; --font: "${FONT}"; --font2: "${FONT2}"; }
${BASE_CSS}
/* Photo above, a solid brand-colour panel below carrying the message: the classic FMCG layout. */
.bg { bottom: 40%; }
.shade { bottom: 40%; background: linear-gradient(180deg, rgba(0,0,0,.35), rgba(0,0,0,0) 30%); }
.block { position: absolute; left: 0; right: 0; bottom: 0; height: 40%; background: var(--c1); color: var(--ink);
  padding: calc(var(--u) * 5) var(--pad); display: flex; flex-direction: column; justify-content: flex-start; }
.headline { font-size: calc(var(--u) * 7.2); line-height: 1.04; font-weight: 800; max-width: 64%; }
.sub { margin-top: calc(var(--u) * 1.8); font-size: calc(var(--u) * 3.4); font-weight: 500; opacity: .9; max-width: 62%; }
.tags { margin-top: calc(var(--u) * 2); display: flex; flex-wrap: wrap; gap: calc(var(--u) * 1.2); max-width: 64%; }
.tags span { border: calc(var(--u) * .3) solid currentColor; border-radius: 999px; font-weight: 700;
  font-size: calc(var(--u) * 2.7); padding: calc(var(--u) * .6) calc(var(--u) * 1.8); }
.ctawrap { margin-top: auto; }
.cta { background: var(--c2); color: var(--c1); }
.product { right: var(--pad); left: auto; transform: none; bottom: calc(var(--h) * .12); height: 48%; max-width: 40%; }
/* 9:16: Stories UI covers the top 14% and bottom 35%: the panel sits in the safe middle band */
body.tall .bg, body.tall .shade { bottom: 0; }
body.tall .block { top: 38%; bottom: auto; height: 27%; padding-top: calc(var(--u) * 4); }
body.tall .product { bottom: auto; top: 18%; height: 30%; }
body.tall .ctawrap { margin-top: calc(var(--u) * 2.4); }
body.wide .bg, body.wide .shade { bottom: 0; right: 45%; }
body.wide .block { left: 55%; top: 0; height: auto; }
body.wide .headline, body.wide .sub, body.wide .tags { max-width: 100%; }
body.wide .product { left: 32%; right: auto; bottom: var(--pad); height: 70%; }
.caption { z-index: 3; }
</style></head><body class="${BODY_CLASS}" dir="${DIR}">
<div class="bg" style="background-image:url('${BG}')"></div><div class="shade"></div>
${LOGO}
<div class="block">
  <div class="headline">${HEADLINE}</div><div class="sub">${SUB}</div><div class="offer">${OFFER}</div>
  <div class="tags">${TAGS}</div>
  <div class="ctawrap ${CTA_CLASS}"><span class="cta">${CTA}</span></div>
</div>
<img class="product ${PROD_CLASS}" src="${PRODUCT}">
<div class="caption">${CAPTION}</div>
</body></html>
