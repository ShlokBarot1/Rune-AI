<!doctype html>
<html><head><meta charset="utf-8">${FONT_LINK}<style>
:root { --w: ${W}px; --h: ${H}px; --u: ${U}px; --pad: ${PAD}px; --top: ${TOP}px; --cap: ${CAP}px;
        --c1: ${C1}; --c2: ${C2}; --ink: ${INK}; --font: "${FONT}"; --font2: "${FONT2}"; }
${BASE_CSS}
/* Awareness: the message IS the ad. Huge type on the brand colour, the photo as a framed card. */
body { background: var(--c1); color: var(--ink); }
.bg { top: auto; left: var(--pad); right: var(--pad); bottom: calc(var(--h) * .05); height: 36%;
  border-radius: calc(var(--u) * 4); box-shadow: 0 calc(var(--u) * 2) calc(var(--u) * 6) rgba(0,0,0,.25); }
.shade { display: none; }
.headline { position: absolute; left: var(--pad); right: var(--pad); top: calc(var(--top) + var(--u) * 14);
  font-size: calc(var(--u) * 10.5); line-height: .98; font-weight: 900; letter-spacing: -.02em; }
.sub { margin-top: calc(var(--u) * 2.4); font-size: calc(var(--u) * 3.8); font-weight: 500; opacity: .92; letter-spacing: 0; }
.ctawrap { margin-top: calc(var(--u) * 3); }
.cta { background: var(--c2); color: var(--c1); }
.product { right: calc(var(--pad) * 1.4); left: auto; transform: none; bottom: calc(var(--h) * .07); height: 34%; max-width: 45%; z-index: 2; }
body.tall .bg { bottom: auto; top: 50%; height: 18%; }
body.tall .product { bottom: auto; top: 44%; height: 22%; }
body.tall .headline { font-size: calc(var(--u) * 11); }
body.wide .bg { left: 58%; top: var(--pad); height: auto; }
body.wide .headline { right: 45%; font-size: calc(var(--u) * 9); }
body.wide .product { right: 6%; height: 70%; }
</style></head><body class="${BODY_CLASS}" dir="${DIR}">
<div class="bg" style="background-image:url('${BG}')"></div><div class="shade"></div>
${LOGO}
<div class="headline">${HEADLINE}<div class="sub">${SUB}</div><div class="offer">${OFFER}</div>
  <div class="ctawrap ${CTA_CLASS}"><span class="cta">${CTA}</span></div></div>
<img class="product ${PROD_CLASS}" src="${PRODUCT}">
<div class="caption">${CAPTION}</div>
</body></html>
